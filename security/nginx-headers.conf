# MehradCodes — security headers for an Nginx host.
# Paste these lines inside the server { } block of the site.
# (If a location { } block has its own add_header lines, Nginx drops the
# server-level ones there — repeat the lines inside that location too.)
# Values match the Cloudflare "Security headers" Transform Rule (grade A+).
# Use only ONE source of headers at a time: if the site stays behind the
# Cloudflare proxy, the Transform Rule already adds them — use either the
# rule OR this snippet, not both.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://mehradcodes-bot.haj0-0mehrad.workers.dev; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
