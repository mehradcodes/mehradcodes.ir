<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فروشگاه دوره‌های مهراد</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @font-face {
    font-family: 'Vazirmatn';
    src: url('../assets/fonts/vazirmatn-arabic.woff2') format('woff2');
    font-weight: 100 900;
    font-display: swap;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: var(--tg-theme-bg-color, #0b0b1e);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #a5a3c7);
    --btn: var(--tg-theme-button-color, #22c55e);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.10);
    --violet: #7c3aed;
    --green: #22c55e;
    --amber: #f59e0b;
  }
  body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px 16px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; padding: 8px 0 20px; }
  header img { width: 96px; height: auto; border-radius: 24px; }
  header h1 { font-size: 24px; font-weight: 900; margin-top: 10px; }
  header p { color: var(--hint); font-size: 14px; margin-top: 4px; }
  .admin-badge {
    display: none;
    margin: 0 auto 14px;
    width: fit-content;
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.5);
    color: #fbbf24;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
  }
  .admin-badge button {
    background: none; border: none; color: #fbbf24;
    font-family: inherit; font-size: 13px; font-weight: 800;
    text-decoration: underline; cursor: pointer; margin-right: 6px;
  }
  .group-title { font-size: 16px; font-weight: 800; margin: 22px 2px 10px; color: #c4b5fd; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .card h3 { font-size: 17px; font-weight: 800; }
  .pill {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    padding: 2px 9px; border-radius: 999px;
    margin-right: 6px; vertical-align: middle;
  }
  .pill.beginner { background: rgba(34, 197, 94, 0.18); color: #4ade80; }
  .pill.advanced { background: rgba(124, 58, 237, 0.25); color: #c4b5fd; }
  .pill.special { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }
  .card p.desc { color: var(--hint); font-size: 13.5px; line-height: 1.9; margin-top: 6px; }
  .card .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 10px; }
  .price { font-size: 16px; font-weight: 800; }
  .price small { font-size: 12px; color: var(--hint); font-weight: 400; }
  .price.soon { color: var(--hint); font-size: 13px; font-weight: 400; }
  .btn {
    font-family: inherit; font-size: 14px; font-weight: 800;
    background: var(--btn); color: var(--btn-text);
    border: none; border-radius: 12px;
    padding: 10px 18px; cursor: pointer; white-space: nowrap;
  }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.ghost { background: transparent; border: 1px solid var(--card-border); color: var(--text); }
  .btn.violet { background: var(--violet); }
  .status { text-align: center; color: var(--hint); font-size: 14px; padding: 30px 10px; line-height: 2; }
  .status.err { color: #fca5a5; }
  /* order panel */
  #order { display: none; }
  #order .card { border-color: rgba(34, 197, 94, 0.4); }
  .pay-box {
    background: rgba(0, 0, 0, 0.3);
    border: 1px dashed rgba(255, 255, 255, 0.25);
    border-radius: 12px; padding: 12px; margin-top: 10px;
    text-align: center;
  }
  .pay-box code {
    font-size: 19px; letter-spacing: 1px; direction: ltr;
    display: block; margin: 6px 0; user-select: all;
  }
  .pay-box small { color: var(--hint); font-size: 12px; }
  .copy-hint { font-size: 12px; color: var(--hint); margin-top: 4px; }
  .field { margin-top: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .field input[type=file] {
    width: 100%; font-family: inherit; font-size: 13px; color: var(--hint);
    background: rgba(0,0,0,0.3); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 10px;
  }
  #receiptPreview { max-width: 100%; border-radius: 12px; margin-top: 10px; display: none; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions .btn { flex: 1; }
  .note { text-align: center; color: var(--hint); font-size: 12.5px; line-height: 1.9; margin-top: 26px; }
  .note a { color: #c4b5fd; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../assets/snake-hero.webp" alt="مهرادیار">
    <h1>فروشگاه دوره‌های مهراد</h1>
    <p>دوره رو انتخاب کن، ثبت‌نام کن — همه‌چیز همینجا</p>
  </header>

  <div class="admin-badge" id="adminBadge">
    👑 شما ادمین هستید
    <button id="adminBtn" type="button">مدیریت قیمت‌ها</button>
  </div>

  <div id="list"><div class="status">در حال بارگذاری دوره‌ها…</div></div>

  <div id="order">
    <div class="card">
      <h3 id="orderTitle"></h3>
      <div class="row"><span class="price" id="orderPrice"></span></div>
      <div class="pay-box">
        <small>واریز کارت‌به‌کارت به شماره‌ی زیر</small>
        <code id="cardNumber" dir="ltr"></code>
        <small id="cardOwner"></small>
        <div class="copy-hint">روی شماره بزن تا کپی بشه 👆</div>
      </div>
      <div id="zarinWrap" style="display:none; margin-top: 12px;">
        <button class="btn violet" id="zarinBtn" type="button" style="width:100%;">💳 پرداخت آنلاین</button>
      </div>
      <div class="field">
        <label for="receiptInput">📸 بعد از واریز، عکس رسید رو اینجا بفرست</label>
        <input type="file" id="receiptInput" accept="image/*">
        <img id="receiptPreview" alt="">
      </div>
      <div class="actions">
        <button class="btn" id="sendReceiptBtn" type="button" disabled>ارسال رسید</button>
        <button class="btn ghost" id="backBtn" type="button">بازگشت</button>
      </div>
      <div class="status" id="orderStatus" style="display:none;"></div>
    </div>
  </div>

  <p class="note">
    پرداخت کارت‌به‌کارت است و بعد از ارسال رسید، مهراد تاییدش می‌کنه.<br>
    سوال داری؟ <a href="https://t.me/mehradcodes" target="_blank">کانال تلگرام</a> ·
    <a href="https://wa.me/989020120386" target="_blank">واتساپ</a>
  </p>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  var WORKER = 'https://mehradcodes-bot.haj0-0mehrad.workers.dev';
  var BOT_URL = 'https://t.me/mehradcodes_bot';
  var initData = tg ? (tg.initData || '') : '';
  var isAdmin = false;
  var currentCourse = null;
  var currentPayment = null;
  var receiptFile = null;

  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  function haptic() { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
  function faNum(n) { return Number(n).toLocaleString('fa-IR'); }
  function openLink(url) {
    if (tg && tg.openTelegramLink && url.indexOf('https://t.me/') === 0) tg.openTelegramLink(url);
    else if (tg && tg.openLink) tg.openLink(url);
    else window.open(url, '_blank');
  }

  // Static course list (names + descriptions only — prices NEVER live here;
  // they come from the Worker, which reads the KV prices Mehrad sets in /admin).
  // Used only if the live fetch fails (e.g. before the Worker update is deployed).
  var STATIC_COURSES = [
    { id: 'py-beginner', group: 'پایتون', title: 'پایتون مقدماتی', level: 'مقدماتی', desc: 'پایتون از صفر تا صد؛ با تمرین و پروژه‌ی کوچک در هر جلسه.' },
    { id: 'py-advanced', group: 'پایتون', title: 'پایتون پیشرفته', level: 'پیشرفته', desc: 'ادامه‌ی مسیر پایتون؛ مباحث پیشرفته‌تر و پروژه‌های واقعی.' },
    { id: 'ml', group: 'پایتون', title: 'ماشین لرنینگ', level: 'پیشرفته', desc: 'آشنایی با یادگیری ماشین با پایتون؛ از مبانی تا ساخت اولین مدل.' },
    { id: 'web-ai-beginner', group: 'طراحی سایت با هوش مصنوعی', title: 'طراحی سایت با هوش مصنوعی — مقدماتی', level: 'مقدماتی', desc: 'ساخت سایت با ابزارهای هوش مصنوعی؛ بدون نیاز به تجربه‌ی قبلی.' },
    { id: 'web-ai-advanced', group: 'طراحی سایت با هوش مصنوعی', title: 'طراحی سایت با هوش مصنوعی — پیشرفته', level: 'پیشرفته', desc: 'سایت‌های حرفه‌ای و فروشگاهی با هوش مصنوعی.' },
    { id: 'ai-beginner', group: 'کار با هوش مصنوعی', title: 'کار با هوش مصنوعی — مقدماتی', level: 'مقدماتی', desc: 'کاربرد روزمره و کاری هوش مصنوعی؛ پرامپت‌نویسی و ابزارها.' },
    { id: 'ai-advanced', group: 'کار با هوش مصنوعی', title: 'کار با هوش مصنوعی — پیشرفته', level: 'پیشرفته', desc: 'خودکارسازی کارها و ساخت گردش‌کار با هوش مصنوعی.' },
    { id: 'n8n', group: 'اتوماسیون', title: 'دوره‌ی n8n', level: 'تخصصی', desc: 'خودکارسازی فرایندها و اتصال سرویس‌ها با n8n.' },
    { id: 'security', group: 'امنیت', title: 'دوره‌ی امنیت', level: 'تخصصی', desc: 'مبانی امنیت وب و محافظت از سایت و داده‌ها.' }
  ];
  var GROUPS = ['پایتون', 'طراحی سایت با هوش مصنوعی', 'کار با هوش مصنوعی', 'اتوماسیون', 'امنیت'];

  function pillClass(level) {
    return level === 'مقدماتی' ? 'beginner' : (level === 'پیشرفته' ? 'advanced' : 'special');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function render(courses, live) {
    var html = '';
    GROUPS.forEach(function (g) {
      var items = courses.filter(function (c) { return c.group === g; });
      if (!items.length) return;
      html += '<div class="group-title">' + esc(g) + '</div>';
      items.forEach(function (c) {
        var priced = c.price != null && Number(c.price) > 0;
        html += '<div class="card">'
          + '<h3>' + esc(c.title) + '<span class="pill ' + pillClass(c.level) + '">' + esc(c.level) + '</span></h3>'
          + '<p class="desc">' + esc(c.desc) + '</p>'
          + '<div class="row">'
          + (priced
              ? '<span class="price">' + faNum(c.price) + ' <small>تومان</small></span>'
              : '<span class="price soon">قیمت به‌زودی اعلام می‌شود</span>')
          + (live
              ? (priced
                  ? '<button class="btn" data-order="' + esc(c.id) + '">🛒 ثبت‌نام</button>'
                  : '<button class="btn" disabled>به‌زودی</button>')
              : '<button class="btn ghost" data-open-bot="1">ثبت‌نام در ربات</button>')
          + '</div></div>';
      });
    });
    document.getElementById('list').innerHTML = html;
    document.querySelectorAll('[data-order]').forEach(function (b) {
      b.addEventListener('click', function () { haptic(); startOrder(b.getAttribute('data-order')); });
    });
    document.querySelectorAll('[data-open-bot]').forEach(function (b) {
      b.addEventListener('click', function () { haptic(); openLink(BOT_URL); });
    });
  }

  function load() {
    var url = WORKER + '/api/courses' + (initData ? ('?initData=' + encodeURIComponent(initData)) : '');
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (data) {
      isAdmin = !!data.is_admin;
      if (isAdmin) document.getElementById('adminBadge').style.display = 'block';
      render(data.courses || [], true);
    }).catch(function () {
      render(STATIC_COURSES, false);
    });
  }

  function startOrder(courseId) {
    if (!initData) { openLink(BOT_URL); return; }
    var list = document.getElementById('list');
    list.innerHTML = '<div class="status">در حال آماده‌سازی سفارش…</div>';
    fetch(WORKER + '/api/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: initData, courseId: courseId })
    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
    .then(function (res) {
      if (res.status !== 200 || !res.body.ok) {
        list.innerHTML = '<div class="status err">' + esc(res.body.error || 'مشکلی پیش اومد؛ دوباره امتحان کن.') + '</div>';
        setTimeout(load, 2500);
        return;
      }
      currentCourse = res.body.course;
      currentPayment = res.body.payment;
      document.getElementById('orderTitle').textContent = 'ثبت‌نام: ' + currentCourse.title;
      document.getElementById('orderPrice').innerHTML = faNum(currentCourse.price) + ' <small>تومان</small>';
      document.getElementById('cardNumber').textContent = currentPayment.card || '';
      document.getElementById('cardOwner').textContent = currentPayment.owner ? ('به نام ' + currentPayment.owner) : '';
      var zw = document.getElementById('zarinWrap');
      if (currentPayment.zarinpal) {
        zw.style.display = 'block';
        document.getElementById('zarinBtn').onclick = function () { openLink(currentPayment.zarinpal); };
      } else zw.style.display = 'none';
      document.getElementById('orderStatus').style.display = 'none';
      document.getElementById('orderStatus').textContent = '';
      document.getElementById('sendReceiptBtn').disabled = true;
      receiptFile = null;
      document.getElementById('receiptInput').value = '';
      document.getElementById('receiptPreview').style.display = 'none';
      list.style.display = 'none';
      document.getElementById('order').style.display = 'block';
      window.scrollTo(0, 0);
    }).catch(function () {
      list.innerHTML = '<div class="status err">ارتباط برقرار نشد؛ دوباره امتحان کن.</div>';
      setTimeout(load, 2500);
    });
  }

  document.getElementById('cardNumber').addEventListener('click', function () {
    var t = this.textContent.replace(/\s/g, '');
    function done() { document.querySelector('.copy-hint').textContent = 'کپی شد ✅'; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, done);
    else done();
    haptic();
  });

  document.getElementById('receiptInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    receiptFile = f || null;
    document.getElementById('sendReceiptBtn').disabled = !receiptFile;
    var img = document.getElementById('receiptPreview');
    if (f) {
      var rd = new FileReader();
      rd.onload = function (ev) { img.src = ev.target.result; img.style.display = 'block'; };
      rd.readAsDataURL(f);
    } else img.style.display = 'none';
  });

  document.getElementById('sendReceiptBtn').addEventListener('click', function () {
    if (!receiptFile || !currentCourse) return;
    var st = document.getElementById('orderStatus');
    st.style.display = 'block';
    st.textContent = 'در حال ارسال رسید…';
    var fd = new FormData();
    fd.append('initData', initData);
    fd.append('courseId', currentCourse.id);
    fd.append('photo', receiptFile);
    fetch(WORKER + '/api/receipt', { method: 'POST', body: fd })
    .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
    .then(function (res) {
      if (res.status === 200 && res.body.ok) {
        st.textContent = 'رسیدت رسید ✅ مهراد بررسی‌ش می‌کنه؛ نتیجه رو تو ربات بهت می‌گه.';
        document.getElementById('sendReceiptBtn').disabled = true;
        haptic();
        setTimeout(function () { if (tg) tg.close(); }, 4000);
      } else {
        st.textContent = res.body.error || 'ارسال نشد؛ دوباره امتحان کن.';
      }
    }).catch(function () { st.textContent = 'ارتباط برقرار نشد؛ دوباره امتحان کن.'; });
  });

  document.getElementById('backBtn').addEventListener('click', function () {
    haptic();
    document.getElementById('order').style.display = 'none';
    document.getElementById('list').style.display = 'block';
    load();
  });

  document.getElementById('adminBtn').addEventListener('click', function () {
    haptic();
    openLink(BOT_URL);
  });

  load();
})();
</script>
</body>
</html>
